schema_version = "1.3"

artifacts = [
  { source = "/testbed" },
]

[task]
name = "workflow-algorithm-bench/algobridge-0004__seurat__absorbs__clusterprofiler"
description = "Implement native marker over-representation analysis in Seurat"
keywords = ["seurat", "clusterprofiler", "enrichment", "hypergeometric", "differential"]

[metadata]
difficulty = "medium"
category = "workflow-algorithm-bench"
authoring_state = "accepted"
tags = ["single-cell", "single-step", "separate-verifier", "no-network"]
execution_target = "cpu"

[verifier]
timeout_sec = 1200.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
gpus = 0
network_mode = "no-network"
mcp_servers = []

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
gpus = 0
network_mode = "no-network"
mcp_servers = []
