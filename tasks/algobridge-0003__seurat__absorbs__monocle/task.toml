schema_version = "1.3"

artifacts = [
  { source = "/testbed" },
]

[task]
name = "workflow-algorithm-bench/algobridge-0003__seurat__absorbs__monocle"
description = "Implement native bounded principal-graph projection and pseudotime in Seurat"
keywords = ["seurat", "monocle3", "pseudotime", "principal-graph", "single-cell"]

[metadata]
difficulty = "hard"
category = "workflow-algorithm-bench"
authoring_state = "accepted"
tags = ["bioinformatics", "single-step", "separate-verifier", "no-network"]
execution_target = "cpu"

[verifier]
timeout_sec = 1800.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384
gpus = 0
network_mode = "no-network"
mcp_servers = []

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384
gpus = 0
network_mode = "no-network"
