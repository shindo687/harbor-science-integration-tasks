schema_version = "1.3"

# Only the modified OpenMM source tree crosses the Agent/verifier boundary.
artifacts = [
  { source = "/testbed" },
]

[task]
name = "workflow-algorithm-bench/algobridge-0016__openmm__absorbs__pyemma"
description = "OpenMM natively implements PyEMMA-compatible reversible Markov-state-model estimation"
keywords = ["workflow-algorithm-bench", "algorithm-migration", "openmm", "pyemma", "markov-state-model"]

[metadata]
difficulty = "hard"
category = "workflow-algorithm-bench"
authoring_state = "accepted"
tags = ["molecular-simulation", "single-step", "separate-verifier", "no-network"]

[verifier]
timeout_sec = 1800.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []
