schema_version = "1.3"

# Only the modified ColabFold tree crosses from the Agent container into the
# clean verifier.  The two donor trees under /opt never become artifacts.
artifacts = [
  { source = "/testbed" },
]

[task]
name = "workflow-feature-bench/structharbor-0002__colabfold__absorbs__dockq-and-ipsae"
description = "Integrate native DockQ and ipSAE calculations into the ColabFold prediction workflow"
keywords = ["colabfold", "dockq", "ipsae", "algorithm-migration", "differential"]

[metadata]
difficulty = "hard"
category = "scientific-software-engineering"
tags = ["structural-biology", "single-step", "separate-verifier", "no-network"]
authoring_state = "accepted"

[verifier]
timeout_sec = 420.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []
