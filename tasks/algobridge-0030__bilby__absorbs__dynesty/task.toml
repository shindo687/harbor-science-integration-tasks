schema_version = "1.3"

# Only the modified Bilby tree crosses the Agent/verifier boundary.  Dynesty
# remains under /opt in the Agent image and is never an artifact.
artifacts = [
  { source = "/testbed" },
]

[task]
name = "workflow-algorithm-bench/algobridge-0030__bilby__absorbs__dynesty"
description = "Implement a native bounded static nested sampler in Bilby"
keywords = ["bilby", "dynesty", "nested-sampling", "bayesian-inference", "differential"]

[metadata]
difficulty = "expert"
category = "workflow-algorithm-bench"
tags = ["statistical-inference", "single-step", "separate-verifier", "no-network"]
authoring_state = "accepted"
execution_target = "cpu"

[verifier]
timeout_sec = 1800.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
mcp_servers = []
